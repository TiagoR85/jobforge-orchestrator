name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    uses: TiagoR85/ci-pipeline-templates/.github/workflows/reusable-dotnet-ci.yml@v1
    with:
      test-project: tests/JobForge.Orchestrator.Tests/JobForge.Orchestrator.Tests.csproj
      dotnet-version: "10.0.x"
      coverage-threshold: "80"

  docker-scan-orchestrator:
    uses: TiagoR85/ci-pipeline-templates/.github/workflows/reusable-docker-scan.yml@v1
    with:
      image-name: jobforge-orchestrator
